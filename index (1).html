// ─── JSONBIN API ───
async function createBin(data) {
  const res = await fetch(API_BASE, {
    method:"POST",
    headers:{"Content-Type":"application/json","X-Master-Key":API_KEY,"X-Bin-Name":"FinanzasFamiliares"},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error("Error creando bin: "+res.status);
  const j = await res.json();
  return j.metadata.id;
}

async function readBin(id) {
  const res = await fetch(`${API_BASE}/${id}/latest`, {
    headers:{"X-Master-Key":API_KEY}
  });
  if(!res.ok) throw new Error("Error leyendo bin: "+res.status);
  const j = await res.json();
  return j.record;
}

async function updateBin(id, data) {
  const res = await fetch(`${API_BASE}/${id}`, {
    method:"PUT",
    headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},
    body: JSON.stringify(data)
  });
  if(!res.ok) throw new Error("Error actualizando: "+res.status);
}

// ─── SAVE ───

    toast("✅ Guardado y sincronizado");
  } catch(e) {
    setSyncDot("error");
    toast("⚠️ Error al sincronizar","err");
  }
}

async function syncNow() {
  if(!binId) return;
  setSyncDot("syncing");

}

        <div class="setup-opt-title">🔗 Unirme a una base existente</div>
        <div class="setup-opt-sub">Tu esposa ya creó la base · Introduce el código que te compartió</div>
      </div>`;
  } else if(step==="crear") {
    sc.innerHTML = `
      <p style="color:#9ca3af;font-size:13px;margin-bottom:16px">Se creará la base de datos con todos tus registros de Marzo. Tardará unos segundos.</p>
      <button class="btn btn-amber" style="width:100%" onclick="crearNuevaBD()">🚀 Crear base de datos</button>
      <button class="btn btn-gray" style="width:100%;margin-top:8px" onclick="renderSetup('main')">← Volver</button>`;
  } else if(step==="unirse") {
    sc.innerHTML = `
      <p style="color:#9ca3af;font-size:13px;margin-bottom:12px">Introduce el código que te compartió tu esposa o marido:</p>
      <div class="form-group"><label>Código de la base de datos</label><input class="inp" id="joinCode" placeholder="Pega el código aquí" style="font-size:14px;letter-spacing:1px"></div>
      <div class="form-actions" style="margin-top:12px">
        <button class="btn btn-amber" onclick="unirseaBD()">🔗 Conectar</button>
        <button class="btn btn-gray" onclick="renderSetup('main')">← Volver</button>
      </div>`;
  }
}

async function crearNuevaBD() {
  const sc = document.getElementById("setup-content");
  sc.innerHTML=`<div style="text-align:center;padding:20px"><div class="spinner" style="margin:0 auto 12px"></div><div style="color:#6b7280;font-size:13px">Creando base de datos...</div></div>`;
  try {
    const id = await createBin(db);
    binId = id;
    localStorage.setItem("fin_binId", id);
    sc.innerHTML=`
      <div style="text-align:center;margin-bottom:16px">
        <div style="font-size:32px;margin-bottom:8px">✅</div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;color:#22c55e;font-size:16px">¡Base de datos creada!</div>
      </div>
      <div class="share-box">
        <div style="font-size:12px;color:#6b7280;margin-bottom:6px">📋 Código para tu esposa — cópialo y mándalo por WhatsApp:</div>
        <div class="share-id" id="codeDisp">${id}</div>
        <button class="btn btn-amber" style="width:100%" onclick="copyCode('${id}')">📋 Copiar código</button>
      </div>
      <button class="btn btn-green" style="width:100%;margin-top:8px" onclick="launchApp()">▶ Entrar a la app</button>`;
  } catch(e) {
    sc.innerHTML=`<div style="color:#ef4444;text-align:center;padding:16px">Error: ${e.message}</div><button class="btn btn-gray" style="margin-top:8px;width:100%" onclick="renderSetup('crear')">Reintentar</button>`;
  }
}

async function unirseaBD() {
  const code = document.getElementById("joinCode").value.trim();
  if(!code){toast("Introduce el código","err");return;}
  const sc=document.getElementById("setup-content");
  sc.innerHTML=`<div style="text-align:center;padding:20px"><div class="spinner" style="margin:0 auto 12px"></div><div style="color:#6b7280;font-size:13px">Conectando...</div></div>`;
  try {
    const data = await readBin(code);
    db = data;
    binId = code;
    localStorage.setItem("fin_binId", code);
    sc.innerHTML=`
      <div style="text-align:center;padding:20px">
        <div style="font-size:32px;margin-bottom:8px">🎉</div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;color:#22c55e;font-size:16px">¡Conectado!</div>
        <div style="color:#6b7280;font-size:12px;margin-top:6px">Ya compartes datos con tu familia</div>
      </div>`;
    setTimeout(launchApp, 1200);
  } catch(e) {
    sc.innerHTML=`<div style="color:#ef4444;text-align:center;padding:12px;font-size:13px">Código incorrecto o sin conexión.<br>${e.message}</div><button class="btn btn-gray" style="margin-top:8px;width:100%" onclick="renderSetup('unirse')">Reintentar</button>`;
  }
}

function copyCode(code) {
  navigator.clipboard.writeText(code).then(()=>toast("✅ Código copiado al portapapeles")).catch(()=>{
    const el=document.getElementById("codeDisp");
    const r=document.createRange(); r.selectNode(el);
    window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
    toast("Selecciona el código y cópialo manualmente","info");
  });
}

function launchApp() {
  document.getElementById("setup").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("hdate").textContent=new Date().toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"});
  showTab("dashboard");
  // Auto-sync cada 60 segundos
  setInterval(()=>{ if(binId) syncNow(); }, 60000);
}

// ─── INIT ───
async function init() {
  if(!binId) { showSetup(); return; }
  try {
    const data = await readBin(binId);
    db = data;
    document.getElementById("loading").style.display="none";
    launchApp();
  } catch(e) {
    // bin inválido
    localStorage.removeItem("fin_binId");
    binId=null;
    showSetup();
  }
}

// ─── TAB ROUTER ───
function showTab(t) {
  ui.tab=t;
  document.querySelectorAll(".tab-btn").forEach((b,i)=>{
    b.classList.toggle("active",["dashboard","gastos","ingresos","ahorros","presupuesto","anual","compartir"][i]===t);
  });
  if(ui.chartDash){try{ui.chartDash.destroy()}catch(e){} ui.chartDash=null;}
  if(ui.chartAnual){try{ui.chartAnual.destroy()}catch(e){} ui.chartAnual=null;}
  render();
}

function render() {
  const c=document.getElementById("content");
  c.className="slide"; void c.offsetWidth;
  if(ui.tab==="dashboard") c.innerHTML=renderDashboard();
  else if(ui.tab==="gastos") c.innerHTML=renderGastos();
  else if(ui.tab==="ingresos") c.innerHTML=renderIngresos();
  else if(ui.tab==="ahorros") c.innerHTML=renderAhorros();
  else if(ui.tab==="presupuesto") c.innerHTML=renderPresupuesto();
  else if(ui.tab==="anual") c.innerHTML=renderAnual();
  else if(ui.tab==="compartir") c.innerHTML=renderCompartir();
  afterRender();
}

function afterRender() {
  if(ui.tab==="dashboard") renderChartDash();
  if(ui.tab==="anual") renderChartAnual();
}

// ─── DASHBOARD ───
function renderDashboard() {
  const {dashMes:mes,dashAnio:anio}=ui;
  const gM=db.gastos.filter(g=>g.mes===mes&&g.fecha.startsWith(anio));
  const iM=db.ingresos.filter(i=>i.mes===mes&&i.fecha.startsWith(anio));
  const tG=gM.reduce((s,g)=>s+g.importe,0);
  const tI=iM.reduce((s,i)=>s+i.cantidad,0);
  const aho=tI-tG;
  const pct=tI>0?(aho/tI*100):0;
  const pctColor=pct>=20?"#22c55e":pct>=10?"#f59e0b":"#ef4444";
  const byCat={};
  gM.forEach(g=>{byCat[g.categoria]=(byCat[g.categoria]||0)+g.importe;});
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const ultimos=[...gM].sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).slice(0,5);
  return `
  <div class="filters">
    <span style="color:#6b7280;font-size:12px">Ver mes:</span>
    <select class="sel" onchange="ui.dashMes=this.value;render()">${selOpts(MESES,mes)}</select>
    <select class="sel" onchange="ui.dashAnio=this.value;render()">${["2025","2026"].map(a=>`<option ${anio===a?"selected":""}>${a}</option>`).join("")}</select>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">💰 Ingresos</div><div class="stat-value" style="color:#22c55e">${fmt(tI)}</div></div>
    <div class="stat-card"><div class="stat-label">💸 Gastos</div><div class="stat-value" style="color:#ef4444">${fmt(tG)}</div></div>
    <div class="stat-card"><div class="stat-label">💎 Ahorro</div><div class="stat-value" style="color:${aho>=0?"#22c55e":"#ef4444"}">${fmt(aho)}</div></div>
    <div class="stat-card"><div class="stat-label">📈 % Ahorro</div><div class="stat-value" style="color:${pctColor}">${pct.toFixed(1)}%</div><div class="stat-sub">Meta: 20%</div></div>
  </div>
  <div class="card">
    <div class="sec-title">Gastos por categoría</div>
    ${catArr.length===0?'<div class="nodata">Sin gastos este mes</div>':`
      <div class="chart-wrap"><canvas id="chartDash"></canvas></div>
      <div style="margin-top:8px">${catArr.slice(0,6).map((c,i)=>`
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #1f2937">
          <div style="width:10px;height:10px;border-radius:2px;background:${COLORS[i%COLORS.length]};flex-shrink:0"></div>
          <span style="flex:1;font-size:12px;color:#9ca3af;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c[0]}</span>
          <span style="font-size:12px;font-weight:600;color:#e2e8f0">${fmt(c[1])}</span>
        </div>`).join("")}
      </div>`}
  </div>
  <div class="card">
    <div class="sec-title">Últimos movimientos</div>
    ${ultimos.length===0?'<div class="nodata">Sin movimientos</div>':ultimos.map(g=>`
      <div class="row-item">
        <div class="row-icon">${CAT_EMOJI[g.categoria]||"📦"}</div>
        <div class="row-main">
          <div class="row-title">${g.subcategoria||g.descripcion||g.categoria}</div>
          <div class="row-sub">${g.fecha} · ${g.persona} · ${g.metodo}</div>
        </div>
        <div style="font-family:'Syne',sans-serif;font-weight:700;color:#ef4444;font-size:14px;flex-shrink:0">${fmt(g.importe)}</div>
      </div>`).join("")}
  </div>`;
}
function renderChartDash() {
  const {dashMes:mes,dashAnio:anio}=ui;
  const gM=db.gastos.filter(g=>g.mes===mes&&g.fecha.startsWith(anio));
  const byCat={};
  gM.forEach(g=>{byCat[g.categoria]=(byCat[g.categoria]||0)+g.importe;});
  const catArr=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(!catArr.length) return;
  const cv=document.getElementById("chartDash"); if(!cv) return;
  if(ui.chartDash) ui.chartDash.destroy();
  ui.chartDash=new Chart(cv,{type:"doughnut",data:{labels:catArr.map(c=>c[0]),datasets:[{data:catArr.map(c=>c[1]),backgroundColor:COLORS,borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:"55%",plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>" "+fmt(ctx.parsed)}}}}});
}

// ─── GASTOS ───

  return `
  <div class="filters">

    <select class="sel" onchange="ui.gFiltrocat=this.value;render()">${selOpts(CATS,fc,"Todas las categorías")}</select>

      <div class="form-group"><label>Subcategoría</label><input class="inp" id="gSub" placeholder="opcional"></div>
      <div class="form-group"><label>Descripción</label><input class="inp" id="gDesc" placeholder="opcional"></div>
      <div class="form-group"><label>Método pago</label><select class="inp" id="gMetodo">${selOpts(METODOS,"Tarjeta")}</select></div>
      <div class="form-group"><label>Importe (€) *</label><input class="inp" type="number" step="0.01" id="gImporte" placeholder="0.00" style="border-color:#f59e0b"></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-amber" onclick="addGasto()">💾 Guardar</button>
      <button class="btn btn-gray" onclick="ui.gShowForm=false;render()">Cancelar</button>
    </div>
  </div>`:""}
  ${filt.length===0?'<div class="nodata">Sin gastos · Pulsa "+ Añadir gasto"</div>':filt.map(g=>`
    <div class="row-item">
      <div class="row-icon">${CAT_EMOJI[g.categoria]||"📦"}</div>
      <div class="row-main">
        <div class="row-title">${g.subcategoria||g.descripcion||g.categoria}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin:3px 0">${tagP(g.persona)} ${tagG(g.categoria)}</div>
        <div class="row-sub">${g.fecha} · ${g.metodo}</div>
      </div>
      <div style="font-family:'Syne',sans-serif;font-weight:700;color:#ef4444;font-size:14px;flex-shrink:0;margin-right:4px">${fmt(g.importe)}</div>
      <button class="del-btn" onclick="delGasto(${g.id})">×</button>
    </div>`).join("")}`;
}
function addGasto(){
  const f=document.getElementById("gFecha").value;
  const imp=parseFloat(document.getElementById("gImporte").value);
  if(!f||!imp){toast("Introduce fecha e importe","err");return;}
  db.gastos.push({id:getId(),fecha:f,mes:mesDesFecha(f),persona:document.getElementById("gPersona").value,categoria:document.getElementById("gCat").value,subcategoria:document.getElementById("gSub").value,descripcion:document.getElementById("gDesc").value,metodo:document.getElementById("gMetodo").value,importe:imp});
  ui.gShowForm=false; save(); render();
}
function delGasto(id){if(!confirm("¿Borrar este gasto?"))return;db.gastos=db.gastos.filter(g=>g.id!==id);save();render();}

function addIngreso(){const f=document.getElementById("iFecha").value,c=parseFloat(document.getElementById("iCant").value);if(!f||!c){toast("Introduce fecha y cantidad","err");return;}db.ingresos.push({id:getId(),fecha:f,mes:mesDesFecha(f),persona:document.getElementById("iPersona").value,tipo:document.getElementById("iTipo").value,descripcion:document.getElementById("iDesc").value,cantidad:c});ui.iShowForm=false;save();render();}

    </div>`).join("")}`;
}
function addAhorro(){const f=document.getElementById("aFecha").value,c=parseFloat(document.getElementById("aCant").value);if(!f||!c){toast("Introduce fecha y cantidad","err");return;}db.ahorros.push({id:getId(),fecha:f,mes:mesDesFecha(f),destino:document.getElementById("aDest").value,cantidad:c,notas:document.getElementById("aNotas").value});ui.aShowForm=false;save();render();}
function delAhorro(id){if(!confirm("¿Borrar?"))return;db.ahorros=db.ahorros.filter(a=>a.id!==id);save();render();}

// ─── PRESUPUESTO ───
function renderPresupuesto(){
  const mes=ui.pMes;
  const gastoPorCat={};
  db.gastos.filter(g=>g.mes===mes).forEach(g=>{gastoPorCat[g.categoria]=(gastoPorCat[g.categoria]||0)+g.importe;});
  const tPres=Object.values(db.presupuesto).reduce((s,v)=>s+(v||0),0);
  const tGas=Object.keys(db.presupuesto).reduce((s,k)=>s+(gastoPorCat[k]||0),0);
  const eC=pct=>pct>=1?"#ef4444":pct>=0.85?"#f59e0b":"#22c55e";
  const eL=pct=>pct>=1?"🔴 SUPERADO":pct>=0.85?"🟡 ATENCIÓN":"🟢 OK";
  return `
  <div class="filters">
    <span style="color:#6b7280;font-size:12px">Gastos de:</span>
    <select class="sel" onchange="ui.pMes=this.value;render()">${selOpts(MESES,mes)}</select>
  </div>
  <div class="bud-total">
    <div class="bud-t-item"><div class="bud-t-label">Presupuesto</div><div class="bud-t-val" style="color:#f59e0b">${fmt(tPres)}</div></div>
    <div class="bud-t-item"><div class="bud-t-label">Gastado</div><div class="bud-t-val" style="color:${tGas>tPres?"#ef4444":"#22c55e"}">${fmt(tGas)}</div></div>
  </div>
  ${CATS.map(cat=>{
    const pres=db.presupuesto[cat]||0,gasto=gastoPorCat[cat]||0;
    const pct=pres>0?Math.min(gasto/pres,1.2):gasto>0?1.2:0;
    const color=eC(pct),isEdit=ui.pEditando===cat;
    return `<div class="card" style="padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:30px;height:30px;border-radius:8px;background:#1f2937;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0">${CAT_EMOJI[cat]||"📦"}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;flex-wrap:wrap;gap:4px">
            <span style="font-size:13px;font-weight:600;color:#e2e8f0">${cat}</span>
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:10px;color:${color}">${eL(pct)}</span>
              ${isEdit?`<input type="number" id="pEdit_${cat.replace(/[^a-z0-9]/gi,"_")}" value="${pres}" style="width:75px;background:#0d1117;border:1px solid #f59e0b;color:#e2e8f0;padding:3px 7px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif" onblur="savePres('${cat}')" onkeydown="if(event.key==='Enter')savePres('${cat}')">`:
              `<button class="btn btn-sm btn-gray" onclick="ui.pEditando='${cat}';render()">${pres===0?"+ Límite":fmt(pres)+" ✏️"}</button>`}
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <div class="prog-bar" style="flex:1"><div class="prog-fill" style="width:${Math.min(pct*100,100)}%;background:${color}"></div></div>
            <span style="font-size:10px;color:#6b7280;white-space:nowrap">${fmt(gasto)}${pres>0?" / "+fmt(pres):""}</span>
          </div>
        </div>
      </div>
    </div>`;
  }).join("")}`;
}
function savePres(cat){const id="pEdit_"+cat.replace(/[^a-z0-9]/gi,"_"),el=document.getElementById(id);if(el)db.presupuesto[cat]=parseFloat(el.value)||0;ui.pEditando=null;save();render();}

// ─── ANUAL ───
function renderAnual(){
  const data=MESES.map(mes=>{
    const ing=db.ingresos.filter(x=>x.mes===mes).reduce((s,x)=>s+x.cantidad,0);
    const gas=db.gastos.filter(x=>x.mes===mes).reduce((s,x)=>s+x.importe,0);
    return{mes:mes.slice(0,3),ing,gas,aho:ing-gas,pct:ing>0?Math.round((ing-gas)/ing*100):0};
  });
  const tI=data.reduce((s,d)=>s+d.ing,0),tG=data.reduce((s,d)=>s+d.gas,0),tA=tI-tG;
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">💰 Ingresos anuales</div><div class="stat-value" style="color:#22c55e;font-size:16px">${fmt(tI)}</div></div>
    <div class="stat-card"><div class="stat-label">💸 Gastos anuales</div><div class="stat-value" style="color:#ef4444;font-size:16px">${fmt(tG)}</div></div>
    <div class="stat-card" style="grid-column:span 2"><div class="stat-label">💎 Balance anual</div><div class="stat-value" style="color:${tA>=0?"#22c55e":"#ef4444"};font-size:22px">${fmt(tA)}</div></div>
  </div>
  <div class="card">
    <div class="sec-title">Evolución mensual</div>
    <div class="chart-wrap"><canvas id="chartAnual"></canvas></div>
    <div class="leg"><div class="leg-item"><div class="leg-dot" style="background:#22c55e"></div>Ingresos</div><div class="leg-item"><div class="leg-dot" style="background:#ef4444"></div>Gastos</div></div>
  </div>
  <div class="card"><div class="sec-title">Resumen por mes</div><div style="overflow-x:auto">
    <table><thead><tr><th style="text-align:left">Mes</th><th>Ingresos</th><th>Gastos</th><th>Ahorro</th><th>%</th><th>Estado</th></tr></thead>
    <tbody>${data.map(d=>`<tr><td>${d.mes}</td><td style="color:#22c55e">${d.ing>0?fmt(d.ing):"-"}</td><td style="color:#ef4444">${d.gas>0?fmt(d.gas):"-"}</td><td style="color:${d.aho>=0?"#22c55e":"#ef4444"};font-weight:600">${d.ing>0||d.gas>0?fmt(d.aho):"-"}</td><td style="color:#9ca3af">${d.ing>0?d.pct+"%":"-"}</td><td style="font-size:11px">${d.ing>0||d.gas>0?(d.aho>=0?"✅":"⚠️"):"-"}</td></tr>`).join("")}
    <tr class="tfoot"><td>TOTAL</td><td style="color:#22c55e">${fmt(tI)}</td><td style="color:#ef4444">${fmt(tG)}</td><td style="color:${tA>=0?"#22c55e":"#ef4444"}">${fmt(tA)}</td><td style="color:#9ca3af">${tI>0?Math.round(tA/tI*100)+"%":"-"}</td><td></td></tr>
    </tbody></table>
  </div></div>`;
}
function renderChartAnual(){
  const data=MESES.map(mes=>{const ing=db.ingresos.filter(x=>x.mes===mes).reduce((s,x)=>s+x.cantidad,0),gas=db.gastos.filter(x=>x.mes===mes).reduce((s,x)=>s+x.importe,0);return{mes:mes.slice(0,3),ing,gas};});
  const cv=document.getElementById("chartAnual");if(!cv)return;
  if(ui.chartAnual)ui.chartAnual.destroy();
  ui.chartAnual=new Chart(cv,{type:"bar",data:{labels:data.map(d=>d.mes),datasets:[{label:"Ingresos",data:data.map(d=>d.ing),backgroundColor:"#22c55e",borderRadius:4},{label:"Gastos",data:data.map(d=>d.gas),backgroundColor:"#ef4444",borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>" "+fmt(ctx.parsed.y)}}},scales:{x:{ticks:{color:"#9ca3af",font:{size:10}},grid:{color:"#1f2937"}},y:{ticks:{color:"#9ca3af",font:{size:10}},grid:{color:"#1f2937"}}}}});
}

// ─── COMPARTIR ───
function renderCompartir(){
  return `
  <div class="card">
    <div class="sec-title">🔗 Compartir con tu esposa</div>
    <p style="color:#9ca3af;font-size:13px;margin-bottom:16px;line-height:1.6">Manda este código a tu esposa para que conecte su app a los mismos datos. Ella solo necesita abrir el archivo HTML y elegir <b style="color:#e2e8f0">"Unirme a una base existente"</b>.</p>
    <div class="share-box">
      <div style="font-size:11px;color:#6b7280;margin-bottom:6px">📋 Tu código compartido:</div>
      <div class="share-id" id="shareCode" style="font-size:13px;word-break:break-all">${binId||"—"}</div>
      <button class="btn btn-amber" style="width:100%;margin-top:8px" onclick="copyShareCode()">📋 Copiar código</button>
    </div>
    <div style="background:#0d1117;border:1px solid #1f2937;border-radius:10px;padding:14px;margin-top:8px">
      <div style="font-size:12px;color:#f59e0b;font-weight:700;margin-bottom:8px">📱 Instrucciones para tu esposa:</div>
      <div style="font-size:12px;color:#9ca3af;line-height:1.8">
        1. Abre el archivo <b style="color:#e2e8f0">FinanzasFamiliares.html</b> en su móvil<br>
        2. Elige <b style="color:#e2e8f0">"Unirme a una base existente"</b><br>
        3. Pega el código de arriba<br>
        4. Pulsa <b style="color:#e2e8f0">"Conectar"</b> ✅
      </div>
    </div>
  </div>
  <div class="card" style="border-color:#374151">
    <div class="sec-title">⚙️ Opciones</div>
    <button class="btn btn-gray" style="width:100%;margin-bottom:8px" onclick="syncNow()">🔄 Sincronizar ahora</button>
    <button class="btn" style="width:100%;background:#7f1d1d;color:#fca5a5" onclick="resetApp()">🔁 Cambiar de base de datos</button>
  </div>`;
}
function copyShareCode(){
  const code=binId;
  if(!code) return;
  navigator.clipboard.writeText(code).then(()=>toast("✅ Código copiado")).catch(()=>{
    const el=document.getElementById("shareCode");
    const r=document.createRange();r.selectNode(el);window.getSelection().removeAllRanges();window.getSelection().addRange(r);
    toast("Selecciona el texto y cópialo","info");
  });
}
function resetApp(){
  if(!confirm("¿Seguro? Tendrás que volver a introducir el código para reconectar.")) return;
  localStorage.removeItem("fin_binId");
  location.reload();
}

// ─── START ───
init();
</script>
</body>
</html>
